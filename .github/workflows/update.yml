name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 30 1,3,5,7,8,10,12 *'
    - cron: '0 0 29 4,6,9,11 *'
    - cron: '0 0 27 2 *' # monthly update
  push:
    branches:
      - test

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore cached Node dependencies
        id: restore-cached-node-dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            ./node_modules
            package-lock.json
          key: node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Node dependencies
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Node dependencies
        id: cache-node-dependencies
        uses: actions/cache/save@v6
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ./node_modules
            package-lock.json
          key: ${{ steps.restore-cached-node-dependencies.outputs.cache-primary-key }}

      - name: Resolve OSM replication state
        id: osm-state
        run: |
          set -euo pipefail
          seq=$(curl -fsS "https://download.geofabrik.de/asia/taiwan-updates/state.txt" \
                | awk -F= '/^sequenceNumber=/{print $2}')
          [ -n "$seq" ] || { echo "no sequenceNumber"; exit 1; }
          echo "sequence-number=$seq" >> "$GITHUB_OUTPUT"

      - name: Restore Cached Map Data
        id: restore-cached-map-data
        uses: actions/cache/restore@v6
        with:
          path: input.osm.pbf
          key: map-data-${{ steps.osm-state.outputs.sequence-number }}
          restore-keys: |
            map-data-${{ steps.osm-state.outputs.sequence-number }}

      - name: Download Map Data
        if: steps.restore-cached-map-data.outputs.cache-hit != 'true'
        run: curl -L -o input.osm.pbf "https://download.geofabrik.de/asia/taiwan-latest.osm.pbf"

      - name: Cache Map Data
        id: cache-map-data
        if: steps.restore-cached-map-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: input.osm.pbf
          key: ${{ steps.restore-cached-map-data.outputs.cache-primary-key }}

      - name: Restore Cached Chunks
        id: restore-cached-chunks
        uses: actions/cache/restore@v6
        with:
          path: chunks
          key: chunks-${{ hashFiles('input.osm.pbf') }}-${{ hashFiles('chunk.js') }}
          restore-keys: |
            chunks-${{ hashFiles('input.osm.pbf') }}-${{ hashFiles('chunk.js') }}

      - name: Chunk Map Data
        if: steps.restore-cached-chunks.outputs.cache-hit != 'true'
        run: |
          mkdir -p chunks
          node chunk.js

      - name: Cache Chunks
        id: cache-chunks
        if: steps.restore-cached-chunks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: chunks
          key: ${{ steps.restore-cached-chunks.outputs.cache-primary-key }}

      - name: Render
        if: steps.restore-cached-tiles-labels.outputs.cache-hit != 'true'
        run: |
          mkdir -p tiles || true
          mkdir -p labels || true
          node tile.js --order position || true

      - name: Configure git
        run: |
          git config --global user.name "github-actions-bot"
          git config --global user.email "41898282+github-actions-bot@users.noreply.github.com"

      - name: Commit Generated Files
        run: |
          git checkout --orphan temp-branch  || true
          git rm -r --cached . >/dev/null || true
          git add ./tiles ./labels ./tile-report.json -f || true
          git commit -m "Updates" || true
      # git rm -r --cached . >/dev/null -> unstage everything while keeping files on disk
      - name: Push to Dist Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin temp-branch:dist --force || true

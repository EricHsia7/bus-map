name: Update

on:
  workflow_dispatch:
  push:
    branches:
      - test

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Restore cached Node dependencies
        id: restore-cached-node-dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ./node_modules
            package-lock.json
          key: node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Node dependencies
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Node dependencies
        id: cache-node-dependencies
        uses: actions/cache/save@v5
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ./node_modules
            package-lock.json
          key: ${{ steps.restore-cached-node-dependencies.outputs.cache-primary-key }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < dependencies.txt

      - name: Restore Cached Osmium
        id: restore-cached-osmium
        uses: actions/cache/restore@v5
        with:
          path: ~/osmium-install
          key: osmium-${{ runner.os }}-libosmium2.20.0-tool1.16.0
          restore-keys: |
            osmium-${{ runner.os }}-

      - name: Install Libosmium
        if: steps.restore-cached-osmium.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v2.20.0 https://github.com/osmcode/libosmium.git
          cmake -S libosmium -B libosmium/build \
            -DCMAKE_INSTALL_PREFIX=$HOME/osmium-install \
            -DBUILD_TESTING=OFF
          cmake --build libosmium/build -j$(nproc)
          cmake --install libosmium/build

      - name: Install Osmium Tool
        if: steps.restore-cached-osmium.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.16.0 https://github.com/osmcode/osmium-tool.git
          cmake -S osmium-tool -B osmium-tool/build \
            -DCMAKE_INSTALL_PREFIX=$HOME/osmium-install \
            -DCMAKE_PREFIX_PATH=$HOME/osmium-install
          cmake --build osmium-tool/build -j$(nproc)
          cmake --install osmium-tool/build

      - name: Cache Osmium
        id: cache-osmium
        uses: actions/cache/save@v5
        if: steps.restore-cached-osmium.outputs.cache-hit != 'true'
        with:
          path: ~/osmium-install
          key: ${{ steps.restore-cached-osmium.outputs.cache-primary-key }}

      - name: Make Osmium available
        run: |
          echo "$HOME/osmium-install/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/osmium-install/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Restore Cached Map Data
        id: restore-cached-map-data
        uses: actions/cache/restore@v5
        with:
          path: input.osm.pbf
          key: map-data-2026-08-02
          restore-keys: |
            map-data-

      - name: Download Map Data
        if: steps.restore-cached-map-data.outputs.cache-hit != 'true'
        run: curl --output input.osm.pbf "https://download.geofabrik.de/asia/taiwan-260802.osm.pbf"

      - name: Cache Map Data
        id: cache-map-data
        if: steps.restore-cached-map-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: input.osm.pbf
          key: ${{ steps.restore-cached-map-data.outputs.cache-primary-key }}
      
      - name: Restore Cached Chunks
        id: restore-cached-chunks
        uses: actions/cache/restore@v5
        with:
          path: chunks
          key: chunks-${{ hashFiles('input.osm.pbf') }}-${{ hashFiles('chunk.js') }}-${{ hashFiles('config.json') }}
          restore-keys: |
            chunks-${{ hashFiles('input.osm.pbf') }}-${{ hashFiles('chunk.js') }}-${{ hashFiles('config.json') }}

      - name: Chunk Map Data
        if: steps.restore-cached-chunks.outputs.cache-hit != 'true'
        run: |
          mkdir -p chunks
          node chunk.js
          chmod +x ./chunk.sh
          ./chunk.sh

      - name: Cache Chunks
        id: cache-chunks
        if: steps.restore-cached-chunks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: chunks
          key: ${{ steps.restore-cached-chunks.outputs.cache-primary-key }}

      - name: Restore Cached Tiles and Labels
        id: restore-cached-tiles-labels
        uses: actions/cache/restore@v5
        with:
          path: ./tiles
          key: tiles-${{ hashFiles('input.osm.pbf') }}-${{ hashFiles('chunk.js') }}-${{ hashFiles('config.json') }}-${{ hashFiles('render.js') }}
          restore-keys: |
            tiles-${{ hashFiles('input.osm.pbf') }}-${{ hashFiles('chunk.js') }}-${{ hashFiles('config.json') }}-${{ hashFiles('render.js') }}

      - name: Render
        if: steps.restore-cached-tiles-labels.outputs.cache-hit != 'true'
        run: |
          mkdir -p tiles || true
          mkdir -p labels || true
          node render.js || true
      
      - name: Cache Tiles and Labels
        id: cache-tiles-labels
        if: steps.restore-cached-tiles-labels.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            chunks
            labels
          key: ${{ steps.restore-cached-tiles-labels.outputs.cache-primary-key }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions-bot"
          git config --global user.email "41898282+github-actions-bot@users.noreply.github.com"

      - name: Commit Generated Files
        run: |
          git checkout --orphan temp-branch  || true
          git rm -r --cached . >/dev/null || true
          git add ./tiles ./labels -f || true
          git commit -m "Updates" || true
      # git rm -r --cached . >/dev/null -> unstage everything while keeping files on disk

      - name: Push to Dist Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin temp-branch:dist --force || true